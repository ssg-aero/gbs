# ============================================================
# CI — Build & Test (multi-platform)
# ============================================================
# Runs on every push/PR to master or dev.
# Builds the C++ library (header-only) + the VTK render module +
# the Python bindings, then runs both the C++ tests (ctest) and the
# Python tests (pytest) on Linux, Windows and macOS in parallel.
#
# Adapted from the Mod3D workflow:
# - one job per OS and compiler, split in parts on their own runners
#   (build-part.yml), a final job per platform; fail-fast OFF
# - micromamba to resolve conda deps (conda-forge + ssg-aero, the
#   latter provides libiges)
# - Windows workarounds (micromamba shell init crashes on the runner
#   image) carried over as-is
# - clang (conda-forge) on Linux/Windows like the local setup; Apple
#   clang on macOS
#
# gbs-specific notes vs Mod3D:
# - OCCT is OFF in the main matrix (kept lean/portable). It is exercised
#   by a dedicated Linux-only `occt` job (fastest-compiling platform) over
#   two versions: occt 8 (target) and occt 7 (legacy) — see bottom of file.
# - on the CMake side, enabling tests OR bindings forces
#   GBS_USE_RENDER=ON -> VTK is required even without interactive
#   rendering (Qt is NOT needed: gbs-render uses the native VTK
#   interactor, not the Qt modules), and gbs-render
#   is a SHARED lib the .pyd and
#   the tests depend on at runtime (hence the PATH / LD_LIBRARY_PATH /
#   DYLD_LIBRARY_PATH handling below)
# - the C++ tests use doctest (header-only, resolved via conda: `doctest`
#   in the env); GoogleTest and its submodule have been removed
# - the Python tests do VTK rendering (test_json.py calls
#   plotter.show()) -> off-screen rendering everywhere + xvfb on Linux
#
# Compilation cache (sccache, every compiler: clang, Apple clang, cl):
# - an entry is keyed by the preprocessed source, the compiler binary and all
#   its options, so a hit gives the very object a compilation would; the links
#   and all the tests always run;
# - saved by the pushes to master and the weekly cold run only (one entry per
#   part of a job, small, see SCCACHE_CACHE_SIZE): the 10 GB of the repository hold the conda
#   environments first; a pull request restores the latest one of master and
#   saves nothing;
# - a cold run (weekly on master, or a manual run with `cold`) starts from an
#   empty cache: a build that only a cache would keep green shows there.

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  schedule:
    - cron: '0 3 * * 1'   # cold run, Mondays 03:00 UTC (default branch)
  workflow_dispatch:   # allow manual re-runs from the Actions tab / gh CLI
    inputs:
      cold:
        description: Build without the compilation cache (cold)
        type: boolean
        default: false

name: CI

# The workflow only reads the repository (the caches and the artifacts use
# the runner's own token). A failure of the weekly cold run shows on no pull
# request: in the Actions tab and the notifications of master only; GitHub
# disables a schedule after 60 days without activity in a public repository.
permissions:
  contents: read

concurrency:
  # the event too: the weekly cold run and a push to master do not cancel each other
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------
  # Build and test, one platform per compiler, each split in parts that run
  # on their own runners (.github/workflows/build-part.yml); the final job
  # of each platform keeps the name of the former single job.
  # ------------------------------------------------------------
  # --- Linux: conda-forge clang, like the local setup ---
  # The runner has 4 cores and 16 GB: Ninja's default of 6 at once,
  # with the compilations that include the BREP kernel at 3 to 4 GB
  # each, starved it (lost during the build, 49 min in, on
  # 2026-11-25). Three of them at a time, four compilations in all
  # (14 GB at most).
  ubuntu:
    name: ubuntu-latest / py3.13 (part ${{ matrix.part }}/2)
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    uses: ./.github/workflows/build-part.yml
    with:
      platform: ubuntu
      part: ${{ matrix.part }}
      parts: 2
      os: ubuntu-latest
      python-version: "3.13"
      extra-packages: >-
        clangxx
        clang-tools
        llvm-tools
        lld
      cmake-extra: >-
        -DCMAKE_C_COMPILER=clang
        -DCMAKE_CXX_COMPILER=clang++
        -DGBS_HEAVY_COMPILE_JOBS=3
      build-jobs: "4"
      test-jobs: 4
      shell: micromamba-shell {0}
      cold: ${{ github.event_name == 'schedule' || inputs.cold == true }}

  ubuntu-check:
    # The required check of the platform: green only if every part is green
    # and the manifests of the parts show every target of the configuration
    # built once and every ctest case run once. `always()`: it concludes
    # even when a part failed, was cancelled or skipped (a required check
    # left pending would block every merge; a skipped one would pass).
    name: ubuntu-latest / py3.13
    needs: ubuntu
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      # (no manifest at all: the check below says so)
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: parts-ubuntu-*
          merge-multiple: true
          path: manifests
      - name: Check the parts
        run: >-
          python3 .github/scripts/ci_parts.py check --manifests manifests
          --parts 2 --platform ubuntu
          --needs-result "${{ needs.ubuntu.result }}"

  # --- Windows: conda-forge clang (the pre-installed MinGW
  #     conflicts with the conda libs) + bash, because
  #     `micromamba shell init` crashes on the runner image ---
  windows-clang:
    name: windows-latest / py3.13 (part ${{ matrix.part }}/2)
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    uses: ./.github/workflows/build-part.yml
    with:
      platform: windows-clang
      part: ${{ matrix.part }}
      parts: 2
      os: windows-latest
      python-version: "3.13"
      extra-packages: >-
        clangxx
        clang-tools
        llvm-tools
        lld
      cmake-extra: >-
        -DCMAKE_C_COMPILER=clang
        -DCMAKE_CXX_COMPILER=clang++
      test-jobs: 4
      shell: bash
      cold: ${{ github.event_name == 'schedule' || inputs.cold == true }}

  windows-clang-check:
    # The required check of the platform: green only if every part is green
    # and the manifests of the parts show every target of the configuration
    # built once and every ctest case run once. `always()`: it concludes
    # even when a part failed, was cancelled or skipped (a required check
    # left pending would block every merge; a skipped one would pass).
    name: windows-latest / py3.13
    needs: windows-clang
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      # (no manifest at all: the check below says so)
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: parts-windows-clang-*
          merge-multiple: true
          path: manifests
      - name: Check the parts
        run: >-
          python3 .github/scripts/ci_parts.py check --manifests manifests
          --parts 2 --platform windows-clang
          --needs-result "${{ needs.windows-clang.result }}"

  # --- Windows: MSVC (cl), the compiler of the conda-forge
  #     win-64 package — MSVC-only code paths (e.g. the former
  #     /fp:fast /arch:AVX2 flags) are only exercised here ---
  # The runner has 4 cores and 16 GB: two compilations including
  # the BREP kernel at a time, four in all (see macOS below). The
  # build took up to 46 min, then more than 58 min (4 of the 7 runs
  # of master on 2026-11-23 and 24 killed by the 60 min cap), then 55
  # to 74 min in one job: three parts, and a cap of its own.
  windows-msvc:
    name: windows-latest (msvc) / py3.13 (part ${{ matrix.part }}/3)
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    uses: ./.github/workflows/build-part.yml
    with:
      platform: windows-msvc
      part: ${{ matrix.part }}
      parts: 3
      os: windows-latest
      compiler: msvc
      python-version: "3.13"
      cmake-extra: >-
        -DCMAKE_C_COMPILER=cl
        -DCMAKE_CXX_COMPILER=cl
        -DGBS_HEAVY_COMPILE_JOBS=2
      build-jobs: "4"
      test-jobs: 4
      cache-size: 1G
      timeout: 120
      shell: bash
      cold: ${{ github.event_name == 'schedule' || inputs.cold == true }}

  windows-msvc-check:
    # The required check of the platform: green only if every part is green
    # and the manifests of the parts show every target of the configuration
    # built once and every ctest case run once. `always()`: it concludes
    # even when a part failed, was cancelled or skipped (a required check
    # left pending would block every merge; a skipped one would pass).
    name: windows-latest (msvc) / py3.13
    needs: windows-msvc
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      # (no manifest at all: the check below says so)
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: parts-windows-msvc-*
          merge-multiple: true
          path: manifests
      - name: Check the parts
        run: >-
          python3 .github/scripts/ci_parts.py check --manifests manifests
          --parts 3 --platform windows-msvc
          --needs-result "${{ needs.windows-msvc.result }}"

  # --- macOS arm64 (Apple Silicon): Apple clang (Xcode) ---
  # Blocking job. Needs an osx-arm64 libiges (conda-forge or
  # ssg-aero, both configured); until that propagates it fails
  # fast at the conda solve, then goes green with no change.
  # The runner has 3 cores and 7 GB: the compilations that include
  # the BREP kernel take 3 to 4 GB each, the others up to 1.8 GB, and
  # Ninja's default of 5 at once swapped (a 7 min build took from 25
  # to 58 min, then hit the timeout). One of them at a time, two
  # compilations in all (5.6 GB at most).
  macos:
    name: macos-latest / py3.13 (part ${{ matrix.part }}/2)
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2]
    uses: ./.github/workflows/build-part.yml
    with:
      platform: macos
      part: ${{ matrix.part }}
      parts: 2
      os: macos-latest
      python-version: "3.13"
      cmake-extra: >-
        -DGBS_HEAVY_COMPILE_JOBS=1
      build-jobs: "2"
      test-jobs: 3
      shell: micromamba-shell {0}
      cold: ${{ github.event_name == 'schedule' || inputs.cold == true }}

  macos-check:
    # The required check of the platform: green only if every part is green
    # and the manifests of the parts show every target of the configuration
    # built once and every ctest case run once. `always()`: it concludes
    # even when a part failed, was cancelled or skipped (a required check
    # left pending would block every merge; a skipped one would pass).
    name: macos-latest / py3.13
    needs: macos
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      # (no manifest at all: the check below says so)
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: parts-macos-*
          merge-multiple: true
          path: manifests
      - name: Check the parts
        run: >-
          python3 .github/scripts/ci_parts.py check --manifests manifests
          --parts 2 --platform macos
          --needs-result "${{ needs.macos.result }}"

  # ============================================================
  # OCCT bridge — dedicated Linux-only job (fastest platform).
  # Builds gbs-occt + its tests against two OCCT majors:
  #   - occt 8 : target (conda-forge migrated to OCCT 8.0)
  #   - occt 7 : legacy, to keep 7.x supported.
  # Kept out of the main matrix to stay lean and portable.
  # ============================================================
  occt:
    name: occt${{ matrix.occt }} (legacy=${{ matrix.legacy }}) / ubuntu
    strategy:
      fail-fast: false
      matrix:
        include:
          - occt: "8"
            legacy: false
          - occt: "7"
            legacy: true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: micromamba-shell {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup micromamba environment (occt ${{ matrix.occt }})
        uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: latest
          environment-name: gbs-occt
          condarc: |
            channels:
              - conda-forge
              - ssg-aero
          create-args: >-
            python=3.13
            cmake>=3.28
            ninja
            vtk
            eigen>=3.3.9
            libboost
            libboost-devel
            rapidjson
            tbb
            tbb-devel
            doctest
            libiges
            occt=${{ matrix.occt }}
            clangxx
            clang-tools
            lld
          cache-environment: true
          init-shell: bash

      - name: Configure
        run: >-
          cmake -B build -S . -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGBS_BUILD_TESTS=ON
          -DGBS_USE_OCCT_UTILS=ON
          -DGBS_USE_PYTHON_BINDINGS=OFF
          -DGBS_BUILD_STUBS=OFF
          -DGBS_USE_CUDA=OFF
          -DGBS_USE_MODULES=OFF
          -DGBS_BUILD_DOC=OFF
          -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++

      - name: Build gbs-occt tests
        run: cmake --build build --target gbs-occt_tests --parallel

      - name: Test C++ (gbs-occt)
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"
          ctest --test-dir build/gbs-occt --output-on-failure
