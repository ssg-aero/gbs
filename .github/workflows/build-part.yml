# ============================================================
# One part of the build and tests of one platform (called by ci.yml)
# ============================================================
# The build of a platform is split in parts that run at the same time on
# their own runners, the same compiler, options and environment in each:
# .github/scripts/ci_parts.py deals the targets that include the BREP
# kernel to the parts, the Python module to part 1 (with the Python tests
# and the gallery), every other target to the last part. Each part runs
# the ctest cases of its own targets and publishes a manifest of what it
# built and ran; the final job of the platform in ci.yml (with the name of
# the former single job, a required check) checks the manifests of all
# the parts: every target of the configuration built once, every ctest
# case run once, every part green.

name: Build part

on:
  workflow_call:
    inputs:
      platform:       # key of the platform: caches, artifacts, final check
        type: string
        required: true
      part:
        type: number
        required: true
      parts:
        type: number
        required: true
      os:
        type: string
        required: true
      compiler:       # '' or 'msvc'
        type: string
        default: ''
      python-version:
        type: string
        required: true
      extra-packages:
        type: string
        default: ''
      cmake-extra:
        type: string
        default: ''
      build-jobs:     # '' : the default of the generator
        type: string
        default: ''
      test-jobs:
        type: number
        required: true
      cache-size:
        type: string
        default: 500M
      timeout:
        type: number
        default: 90
      shell:
        type: string
        required: true
      cold:           # no compilation cache restored
        type: boolean
        default: false

permissions:
  contents: read

env:
  # cold: no compilation cache restored; the cache is saved from master only
  GBS_CI_COLD: ${{ inputs.cold && 'true' || 'false' }}
  GBS_CI_SAVE_CACHE: ${{ (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) && 'true' || 'false' }}

jobs:
  part:
    name: part
    runs-on: ${{ inputs.os }}
    # A hung build or test cannot hold the run for GitHub's 6 h default
    # (queue time is not covered by this).
    timeout-minutes: ${{ inputs.timeout }}
    defaults:
      run:
        shell: ${{ inputs.shell }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Set up the conda environment (deps mirror the conda-forge
      # gbs-feedstock recipe)
      # ------------------------------------------------------------
      # On Windows we omit `init-shell` because `micromamba shell init`
      # crashes on the runner image (exit 0xC0000005); we activate the
      # env manually in the next step.
      - name: Setup micromamba environment (Windows)
        if: runner.os == 'Windows'
        uses: mamba-org/setup-micromamba@v2
        with:
          # Pinned version (instead of `latest`) to force the download
          # of a healthy binary: the micromamba pre-installed on the
          # runner image crashes on its subcommands.
          micromamba-version: '1.5.10-0'
          environment-name: gbs-ci
          condarc: |
            channels:
              - conda-forge
              - ssg-aero
          create-args: >-
            python=${{ inputs.python-version }}
            cmake>=3.28
            ninja
            pybind11
            vtk
            eigen>=3.3.9
            libboost
            libboost-devel
            rapidjson
            tbb
            tbb-devel
            doctest
            libiges
            numpy
            pyvista
            pythreejs
            pytest
            pytest-timeout
            nbclient
            ipykernel
            sccache
            ${{ inputs.extra-packages }}
          cache-environment: true
          init-shell: none

      # `init-shell: none` does not expose CONDA_PREFIX/PATH, so we
      # activate the env by hand for the following steps (otherwise
      # CMake falls back to the host Python and finds neither VTK nor
      # the bindings).
      - name: Activate micromamba env (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          env_path="$MAMBA_ROOT_PREFIX/envs/gbs-ci"
          echo "CONDA_PREFIX=$env_path" >> "$GITHUB_ENV"
          # bin/ too, as conda's own activation: sccache.exe is there
          echo "$env_path/bin" >> "$GITHUB_PATH"
          echo "$env_path/Library/bin" >> "$GITHUB_PATH"
          echo "$env_path/Library/usr/bin" >> "$GITHUB_PATH"
          echo "$env_path/Library/mingw-w64/bin" >> "$GITHUB_PATH"
          echo "$env_path/Scripts" >> "$GITHUB_PATH"
          echo "$env_path" >> "$GITHUB_PATH"

      - name: Setup micromamba environment (Unix)
        if: runner.os != 'Windows'
        uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: latest
          environment-name: gbs-ci
          condarc: |
            channels:
              - conda-forge
              - ssg-aero
          create-args: >-
            python=${{ inputs.python-version }}
            cmake>=3.28
            ninja
            pybind11
            vtk
            eigen>=3.3.9
            libboost
            libboost-devel
            rapidjson
            tbb
            tbb-devel
            doctest
            libiges
            numpy
            pyvista
            pythreejs
            pytest
            pytest-timeout
            nbclient
            ipykernel
            sccache
            ${{ inputs.extra-packages }}
          cache-environment: true
          init-shell: bash

      # xvfb provides a display + GL context for the off-screen VTK
      # rendering of the Python tests on Linux (headless runner).
      - name: Install xvfb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # ------------------------------------------------------------
      # Compilation cache (see the top of this file)
      # ------------------------------------------------------------
      # Fails here, plainly, if sccache cannot be found: the build would
      # otherwise fail on every compilation (no fallback to a build without
      # the cache). Its absolute path (Windows form on Windows) goes to the
      # configuration and the statistics.
      - name: Compilation cache tool
        id: sccache
        run: |
          sccache_path=$(command -v sccache) || {
            echo "::error::sccache is not on the PATH of the conda environment"
            exit 1
          }
          if [ "$RUNNER_OS" = Windows ]; then sccache_path=$(cygpath -m "$sccache_path"); fi
          "$sccache_path" --version
          echo "GBS_SCCACHE=$sccache_path" >> "$GITHUB_ENV"

      - name: Compilation cache settings
        run: |
          {
            echo "SCCACHE_DIR=$RUNNER_TEMP/sccache"
            echo "SCCACHE_CACHE_SIZE=${{ inputs.cache-size || '500M' }}"
            echo "SCCACHE_IDLE_TIMEOUT=0"
          } >> "$GITHUB_ENV"

      - name: Restore the compilation cache
        if: env.GBS_CI_COLD != 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ inputs.platform }}-p${{ inputs.part }}of${{ inputs.parts }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sccache-${{ inputs.platform }}-p${{ inputs.part }}of${{ inputs.parts }}-

      # ------------------------------------------------------------
      # Configure
      # ------------------------------------------------------------
      # On conda Windows the libs live under CONDA_PREFIX/Library
      # (not directly under CONDA_PREFIX as on Unix).
      # CMAKE_RUNTIME_OUTPUT_DIRECTORY co-locates the built DLLs/exes
      # (gbs-render.dll, the test exes) in Library/bin, which is on the
      # PATH alongside the VTK/TBB/... DLLs. Without it, doctest_discover_tests
      # runs each test exe at build time and fails with 0xc0000135
      # (DLL not found), since gbs-render.dll is a SHARED lib built in a
      # different directory and not yet installed.
      # cl.exe / link.exe and the Windows SDK are only on PATH inside a
      # Visual Studio developer environment.
      # The targets of the build tree, read by the split (CMake File API)
      - name: Query the code model
        run: mkdir -p build/.cmake/api/v1/query && touch build/.cmake/api/v1/query/codemodel-v2

      - name: MSVC developer environment (Windows / MSVC)
        if: inputs.compiler == 'msvc'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >-
          cmake -B build -S . -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGBS_BUILD_TESTS=ON
          -DGBS_USE_PYTHON_BINDINGS=ON
          -DGBS_USE_RENDER=ON
          -DGBS_BUILD_STUBS=OFF
          -DGBS_USE_OCCT_UTILS=OFF
          -DGBS_USE_CUDA=OFF
          -DGBS_USE_MODULES=OFF
          -DGBS_BUILD_DOC=OFF
          "-DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX/Library"
          "-DCMAKE_RUNTIME_OUTPUT_DIRECTORY=$CONDA_PREFIX/Library/bin"
          "-DCMAKE_C_COMPILER_LAUNCHER=$GBS_SCCACHE"
          "-DCMAKE_CXX_COMPILER_LAUNCHER=$GBS_SCCACHE"
          ${{ inputs.cmake-extra }}

      - name: Configure (Unix)
        if: runner.os != 'Windows'
        run: >-
          cmake -B build -S . -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DGBS_BUILD_TESTS=ON
          -DGBS_USE_PYTHON_BINDINGS=ON
          -DGBS_USE_RENDER=ON
          -DGBS_BUILD_STUBS=OFF
          -DGBS_USE_OCCT_UTILS=OFF
          -DGBS_USE_CUDA=OFF
          -DGBS_USE_MODULES=OFF
          -DGBS_BUILD_DOC=OFF
          -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX
          "-DCMAKE_C_COMPILER_LAUNCHER=$GBS_SCCACHE"
          "-DCMAKE_CXX_COMPILER_LAUNCHER=$GBS_SCCACHE"
          ${{ inputs.cmake-extra }}

      # The targets of this part, printed with those of the other parts
      # (.github/scripts/ci_parts.py: deterministic, from the configuration)
      - name: Split
        id: plan
        run: python .github/scripts/ci_parts.py plan --build build --part ${{ inputs.part }} --parts ${{ inputs.parts }} --out parts

      # (`build-jobs` empty: the default of the generator; target names
      # have no space)
      - name: Build
        run: cmake --build build --parallel ${{ inputs.build-jobs }} --target $(tr '\n' ' ' < parts/targets.txt)

      # (informative: never fails the job by itself)
      - name: Compilation cache statistics
        if: ${{ !cancelled() && steps.sccache.outcome == 'success' }}
        continue-on-error: true
        run: |
          "$GBS_SCCACHE" --show-stats || true
          { echo '```'; "$GBS_SCCACHE" --show-stats; echo '```'; } >> "$GITHUB_STEP_SUMMARY" || true
          "$GBS_SCCACHE" --stop-server || true

      # whether the build passed or not: its objects are good ones
      - name: Save the compilation cache
        if: ${{ !cancelled() && steps.sccache.outcome == 'success' && env.GBS_CI_SAVE_CACHE == 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/sccache
          key: sccache-${{ inputs.platform }}-p${{ inputs.part }}of${{ inputs.parts }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Install gbs-render (SHARED) + the bindings into site-packages
      # (pygbs/) so that `import pygbs.gbs` and loading the render lib
      # work from the tests.
      - name: Install
        if: steps.plan.outputs.bindings == 'true'
        run: cmake --install build

      # ------------------------------------------------------------
      # C++ tests (ctest)
      # ------------------------------------------------------------
      # One process per test case (doctest_discover_tests), as many at once
      # as the runner has cores (`test-jobs`); they were run one after the
      # other. --output-on-failure prints the output of each failed case
      # whole, and ctest lists them all at the end. --no-tests=error: a
      # build that registers no test fails.
      # On Windows the DLLs (VTK/TBB/libIGES/gbs-render) live in
      # CONDA_PREFIX/Library/bin -> they must be on the PATH.
      # The ctest cases of the targets of this part; fails if one of them was
      # not built or if a case belongs to no target of the configuration
      - name: Select the C++ tests
        run: python .github/scripts/ci_parts.py select --build build --plan parts

      - name: Test C++ (Windows)
        if: runner.os == 'Windows'
        run: |
          export PATH="$CONDA_PREFIX/Library/bin:$PATH"
          ctest --test-dir build --output-on-failure -C Release --no-tests=error --parallel ${{ inputs.test-jobs }} --tests-from-file "${{ github.workspace }}/parts/tests.txt" --output-junit "${{ github.workspace }}/parts/junit-${{ inputs.part }}.xml"

      - name: Test C++ (Linux)
        if: runner.os == 'Linux'
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"
          ctest --test-dir build --output-on-failure -C Release --no-tests=error --parallel ${{ inputs.test-jobs }} --tests-from-file "${{ github.workspace }}/parts/tests.txt" --output-junit "${{ github.workspace }}/parts/junit-${{ inputs.part }}.xml"

      - name: Test C++ (macOS)
        if: runner.os == 'macOS'
        run: |
          export DYLD_LIBRARY_PATH="$CONDA_PREFIX/lib:$DYLD_LIBRARY_PATH"
          ctest --test-dir build --output-on-failure -C Release --no-tests=error --parallel ${{ inputs.test-jobs }} --tests-from-file "${{ github.workspace }}/parts/tests.txt" --output-junit "${{ github.workspace }}/parts/junit-${{ inputs.part }}.xml"

      # ------------------------------------------------------------
      # Python tests (pytest) — off-screen VTK rendering
      # ------------------------------------------------------------
      - name: Test Python (Windows)
        id: pytest_windows
        if: runner.os == 'Windows' && steps.plan.outputs.bindings == 'true'
        env:
          PYVISTA_OFF_SCREEN: "true"
        run: |
          export PATH="$CONDA_PREFIX/Library/bin:$PATH"
          pytest python/tests/ -v --timeout=120 -ra

      - name: Test Python (Linux)
        id: pytest_linux
        if: runner.os == 'Linux' && steps.plan.outputs.bindings == 'true'
        env:
          PYVISTA_OFF_SCREEN: "true"
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"
          xvfb-run -a pytest python/tests/ -v --timeout=120 -ra

      # Gallery of the examples (docs/sources/examples): the booleans and the
      # meshes rendered off screen, published as an artifact of the build to
      # check them visually
      - name: Gallery of the examples (Linux)
        if: runner.os == 'Linux' && steps.plan.outputs.bindings == 'true'
        env:
          PYVISTA_OFF_SCREEN: "true"
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"
          xvfb-run -a python docs/sources/examples/gallery.py --out gallery

      - name: Publish the gallery (Linux)
        if: runner.os == 'Linux' && steps.plan.outputs.bindings == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gallery
          path: gallery
          if-no-files-found: error

      - name: Test Python (macOS)
        id: pytest_macos
        if: runner.os == 'macOS' && steps.plan.outputs.bindings == 'true'
        env:
          PYVISTA_OFF_SCREEN: "true"
        run: |
          export DYLD_LIBRARY_PATH="$CONDA_PREFIX/lib:$DYLD_LIBRARY_PATH"
          pytest python/tests/ -v --timeout=120 -ra

      # ------------------------------------------------------------
      # What this part built and ran, for the final job of the platform
      # ------------------------------------------------------------
      - name: Manifest of the part
        if: ${{ always() && steps.plan.outcome == 'success' }}
        run: >-
          python .github/scripts/ci_parts.py manifest --plan parts
          --junit parts/junit-${{ inputs.part }}.xml
          --status ${{ job.status }}
          --python-tests ${{ steps.plan.outputs.bindings != 'true' && 'skipped' || runner.os == 'Linux' && steps.pytest_linux.outcome || runner.os == 'macOS' && steps.pytest_macos.outcome || steps.pytest_windows.outcome }}
          --platform ${{ inputs.platform }}
          --out parts/manifest-${{ inputs.part }}.json

      - name: Publish the manifest of the part
        if: ${{ always() && steps.plan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: parts-${{ inputs.platform }}-${{ inputs.part }}
          path: |
            parts/manifest-${{ inputs.part }}.json
            parts/junit-${{ inputs.part }}.xml
          if-no-files-found: warn
          overwrite: true
